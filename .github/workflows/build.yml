name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build signed release APK
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ParallaxWall.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ParallaxWall-apk
          path: ParallaxWall.apk
      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "第 ${{ github.run_number }} 版"
          files: ParallaxWall.apk
          make_latest: true
